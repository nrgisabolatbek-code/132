<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мәтін тану жүйесі</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .card {
      width: 100%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      padding: 35px;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      color: #0f172a;
      font-size: 34px;
    }

    .subtitle {
      text-align: center;
      color: #475569;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .upload-box {
      border: 2px dashed #93c5fd;
      background: #eff6ff;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="file"] {
      margin-top: 10px;
      font-size: 15px;
    }

    .buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      flex: 1;
      min-width: 220px;
      padding: 15px 20px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-text {
      background: #2563eb;
      color: white;
    }

    .btn-docx {
      background: #16a34a;
      color: white;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #f8fafc;
      color: #1e293b;
      font-weight: bold;
      min-height: 24px;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      margin-top: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 16px;
      font-size: 15px;
      resize: vertical;
      outline: none;
    }

    .footer-note {
      margin-top: 15px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Қазақша мәтін тану жүйесі</h1>
    <div class="subtitle">
      Суреттен мәтінді танып, экранға шығарады және Word файлына сақтайды
    </div>

    <div class="upload-box">
      <div><strong>Суретті таңдаңыз</strong></div>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="buttons">
      <button class="btn-text" onclick="uploadText()">Мәтінді шығару</button>
      <button class="btn-docx" onclick="downloadDocx()">Word-қа жүктеу</button>
    </div>

    <div id="status">Файл таңдалмаған</div>

    <textarea id="resultText" placeholder="Танылған мәтін осы жерде шығады..."></textarea>

    <div class="footer-note">
      Avtor:Zhalgasbekuly Alisher Orynbek Nursultan
    </div>
  </div>

  <script>
    async function uploadText() {
      const file = document.getElementById("fileInput").files[0];
      const status = document.getElementById("status");
      const resultText = document.getElementById("resultText");

      if (!file) {
        alert("Алдымен файл таңдаңыз");
        return;
      }

      status.innerText = "Мәтін танылып жатыр...";
      resultText.value = "";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("/upload", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          status.innerText = "Қате шықты";
          resultText.value = data.error || "Белгісіз қате";
          return;
        }

        status.innerText = "Дайын";
        resultText.value = data.text;
      } catch (error) {
        status.innerText = "Серверге қосылу қатесі";
        resultText.value = error.message;
      }
    }

    async function downloadDocx() {
      const file = document.getElementById("fileInput").files[0];
      const status = document.getElementById("status");

      if (!file) {
        alert("Алдымен файл таңдаңыз");
        return;
      }

      status.innerText = "Word файлы дайындалып жатыр...";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("/upload-docx", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const data = await response.json();
          status.innerText = "Қате шықты";
          alert(data.error || "Word жасау қатесі");
          return;
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "result.docx";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        status.innerText = "Word файлы жүктелді";
      } catch (error) {
        status.innerText = "Серверге қосылу қатесі";
        alert(error.message);
      }
    }
  </script>
</body>
</html>
