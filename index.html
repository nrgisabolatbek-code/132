<!DOCTYPE html>
<html>
<head>
    <title>Мәтінді тану</title>
</head>
<body>
    <h1>Суреттегі мәтінді тану (Gemini AI)</h1>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="upload()">Тану</button>
    <pre id="result"></pre>

    <script>
        async function upload() {
       async function upload() {
    const input = document.getElementById('imageInput');
    if (!input.files[0]) {
        alert("Файл таңдаңыз!");
        return;
    }
    const formData = new FormData();
    formData.append('file', input.files[0]);

    document.getElementById('result').innerText = "Өңделуде...";

    try {
        const response = await fetch('/upload', {
            method: 'POST',
            body: formData
        });
        
        if (!response.ok) {
            throw new Error('Сервер қатесі: ' + response.status);
        }
        
        const data = await response.json();
        document.getElementById('result').innerText = data.text;
    } catch (error) {
        document.getElementById('result').innerText = "Қате орын алды: " + error.message;
        console.error(error);
    }
}
        }
    </script>
</body>
</html>
